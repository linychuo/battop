[package]
name = "battop"
version = "0.1.0"
edition = "2024"
description = "Linux battery-aware CPU power management daemon"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
