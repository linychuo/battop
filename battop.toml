[battery]
governor = "powersave"
turbo = "never"
# energy_performance_preference = "balance_power"
# max_freq = 2000000  # kHz (e.g. 2.0 GHz)

[charger]
governor = "performance"
turbo = "auto"
# energy_performance_preference = "balance_performance"
# min_freq = 800000  # kHz (e.g. 0.8 GHz)

[charge_control]
stop_threshold = 80
start_threshold = 40

[general]
poll_interval_secs = 5
log_level = "info"
